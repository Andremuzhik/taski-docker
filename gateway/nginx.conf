server {
  listen 80;

  # Встроенный DNS-резолвер Docker: даёт nginx резолвить
  # имена контейнеров в рантайме, а не только при старте
  resolver 127.0.0.11 valid=10s;

  # Запросы по адресам /api/... перенаправляй в контейнер backend
  location /api/ {
    # Подменяем адрес "backend" в заголовке Host на тот,
    # который пользователь ввёл в браузере
    proxy_set_header Host $http_host;
    # Переменная в proxy_pass откладывает резолв имени "backend"
    # до момента запроса, поэтому гонка на старте не роняет nginx.
    # Путь в proxy_pass не указываем: nginx передаёт исходный URI как есть.
    set $backend_upstream backend:8000;
    proxy_pass http://$backend_upstream;
  }
  location /admin/ {
    proxy_set_header Host $http_host;
    set $backend_upstream backend:8000;
    proxy_pass http://$backend_upstream;
  }

  location / {
    alias /staticfiles/;
    index index.html;
  }
}
